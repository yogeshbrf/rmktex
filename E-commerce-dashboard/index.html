<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMK Textiles — Role-Based E-Commerce Operations System</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Socket.IO Client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-container">
    <!-- ==========================================
         TOP HEADER & NAVIGATION BAR (AUTHENTICATED DASHBOARDS ONLY)
         ========================================== -->
    <header class="top-header-navbar" id="top-header-navbar" style="display: none;">
      <!-- Upper Main Bar -->
      <div class="top-header-main">
        <div class="header-brand">
          <img src="image.png" alt="RMK Textiles Logo" class="brand-logo-img" style="height: 38px !important; max-height: 38px !important; width: 120px !important; max-width: 120px !important; object-fit: contain;">
          <div class="brand-text">
            <span class="brand-name">RMK TEXTILES</span>
            <span class="panel-badge" id="sidebar-panel-badge">Operations Panel</span>
          </div>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="globalSearchInput" placeholder="Search orders, products, customers, staff..." onkeyup="handleGlobalSearch(event)">
        </div>

        <div class="header-right-actions">
          <button class="notification-btn" onclick="showToast('Operations alert: 5 pending SLA orders.', 'info')" title="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="notification-dot"></span>
          </button>

          <div class="user-profile-menu dropdown">
            <div class="d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120" alt="Staff Profile" class="user-avatar">
              <div class="user-info d-none d-sm-block">
                <div class="user-name" id="header-user-name">Staff</div>
                <div class="user-role" id="header-user-role">Operations</div>
              </div>
              <i class="fa-solid fa-chevron-down text-white-50 ms-1" style="font-size: 11px;"></i>
            </div>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
              <li><a class="dropdown-item" href="javascript:openStaffProfileModal()"><i class="fa-solid fa-user me-2 text-primary"></i>Profile Details</a></li>
              <li><a class="dropdown-item" href="javascript:showToast('System preferences updated', 'info')"><i class="fa-solid fa-sliders me-2 text-secondary"></i>Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="javascript:logoutUser()"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
            </ul>
          </div>

          <button class="mobile-toggle-btn d-lg-none" onclick="toggleMobileMenu()" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>

      <!-- Dynamic Lower Horizontal Navigation Menu (Sector Isolated) -->
      <nav class="top-nav-menu" id="top-nav-menu">
        <div class="nav-container" id="nav-container-dynamic">
          <!-- Rendered dynamically per role by app.js router -->
        </div>
      </nav>
    </header>

    <!-- ==========================================
         MAIN CONTENT DYNAMIC VIEW CONTAINER
         ========================================== -->
    <div class="main-wrapper">
      <main id="app-view" class="content-body">
        <!-- Rendered dynamically by app.js router -->
      </main>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="toast-container-custom"></div>

  <!-- ==========================================
       ORDER DETAILS MODAL (STEPPER TIMELINE)
       ========================================== -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-lg);" id="orderModalBodyContainer">
        <!-- Rendered dynamically by openOrderModal(id) in app.js -->
      </div>
    </div>
  </div>

  <!-- ==========================================
       NEW TICKET MODAL
       ========================================== -->
  <div class="modal fade" id="newTicketModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-lg);">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-dark"><i class="fa-solid fa-ticket text-primary me-2"></i>Create New Support Ticket</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form onsubmit="createNewSupportTicket(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size: 13px;">Customer Name</label>
              <input type="text" id="ticketCustomerName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size: 13px;">Order ID (Optional)</label>
              <input type="text" id="ticketOrderId" class="form-control" placeholder="e.g. ATD1006">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size: 13px;">Subject</label>
              <input type="text" id="ticketSubject" class="form-control" placeholder="e.g. Delayed Delivery Inquiry" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size: 13px;">Priority Level</label>
              <select id="ticketPriority" class="form-select">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size: 13px;">Issue Details</label>
              <textarea id="ticketDetails" class="form-control" rows="3" placeholder="Describe the customer issue..."></textarea>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-primary-custom">Submit Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ==========================================
       STAFF PROFILE MODAL
       ========================================== -->
  <div class="modal fade" id="staffProfileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-lg);" id="staffProfileModalContent">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Runtime Configuration -->
  <script src="js/config.js"></script>

  <!-- Central Store Data Engine -->
  <script src="js/store.js"></script>

  <!-- Sector Dashboard Modules -->
  <script src="js/warehouse.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/dispatch.js"></script>
  <script src="js/delivery.js"></script>
  <script src="js/support.js"></script>
  <script src="js/finance.js"></script>

  <!-- Core App Controller & Router -->
  <script src="js/app.js"></script>
</body>
</html>
